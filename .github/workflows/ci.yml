name: Data Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FIXTURE_PATH: week3/tests/fixtures/demand_corrupted.parquet

jobs:
  data-quality:
    name: Data quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy pytest

      - name: Generate corrupted test fixture
        run: python week3/scripts/generate_test_fixture.py --output "$FIXTURE_PATH"

      - name: Run data validator (expected to fail with 3 errors)
        id: validate
        continue-on-error: true
        run: |
          python week3/scripts/validate_data.py "$FIXTURE_PATH" \
            --output week3/data_quality_report.json
          echo "validator_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Verify validator caught the corruption
        run: |
          if [ "${{ steps.validate.outcome }}" != "failure" ]; then
            echo "❌ Validator should have detected corruption but didn't!"
            exit 1
          fi
          echo "✅ Validator correctly flagged corruption in fixture."

      - name: Upload data quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: week3/data_quality_report.json
          retention-days: 30

      - name: Run pytest data-quality suite (expected to fail on corruption)
        id: pytest
        continue-on-error: true
        env:
          WEEK3_DATA_PATH: ${{ env.FIXTURE_PATH }}
        run: pytest week3/tests/ -v --tb=short

      - name: Verify pytest caught the corruption
        run: |
          if [ "${{ steps.pytest.outcome }}" != "failure" ]; then
            echo "❌ Pytest should have caught the corruption but passed!"
            exit 1
          fi
          echo "✅ Pytest correctly failed on corrupted fixture."