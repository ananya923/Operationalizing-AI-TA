name: Week 5 — Deploy TechCorp Agent to GKE

on:
  push:
    branches:
      - main
    paths:
      - "week5/**"                 # only trigger when week5 code changes
      - ".github/workflows/deploy.yml"
  workflow_dispatch:               # allow manual trigger from GitHub Actions UI

jobs:

  # ── Job 1: Run tests ────────────────────────────────────────────────────────
  test:
    name: Run pytest
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r week5/requirements.txt

    - name: Create dummy techcorp.db for tests
      # Tests don't need the real DB — guardrails/intent tests are DB-independent.
      # database.py tests need the real file; skip those in CI by providing a stub.
      run: |
        mkdir -p data/raw/techcorp
        # Copy the JSON config files (committed to repo, not LFS)
        # The real techcorp.db is LFS — CI uses a minimal stub so non-DB tests pass
        python3 -c "
        import sqlite3, os
        db_path = 'data/raw/techcorp/techcorp.db'
        if not os.path.exists(db_path) or os.path.getsize(db_path) < 1000:
            conn = sqlite3.connect(db_path)
            conn.execute('CREATE TABLE IF NOT EXISTS employees (id INTEGER, name TEXT, email TEXT, department_id INTEGER, department_name TEXT, job_level TEXT, title TEXT, salary REAL, ssn TEXT, address TEXT, phone TEXT, hire_date TEXT, manager_id INTEGER, bonus_eligible INTEGER, stock_options INTEGER)')
            conn.execute('CREATE TABLE IF NOT EXISTS expenses (id INTEGER, employee_id INTEGER, employee_name TEXT, amount REAL, category TEXT, description TEXT, date TEXT, status TEXT, approver_id INTEGER, approver_name TEXT, vendor TEXT, receipt_location TEXT, notes TEXT)')
            conn.execute('CREATE TABLE IF NOT EXISTS projects (id INTEGER, name TEXT, description TEXT, budget REAL, spent REAL, status TEXT, start_date TEXT, end_date TEXT, lead_id INTEGER, lead_name TEXT, team_ids TEXT, team_size INTEGER, department_id INTEGER)')
            conn.execute('CREATE TABLE IF NOT EXISTS benefits (employee_id INTEGER, employee_name TEXT, health_plan TEXT, health_plan_cost REAL, dental_plan TEXT, vision_plan TEXT, retirement_plan TEXT, retirement_contribution_pct REAL, life_insurance TEXT, fsa_balance REAL, hsa_balance REAL, pto_days INTEGER, pto_used INTEGER)')
            conn.execute(\"INSERT INTO employees VALUES (1,'John Smith','john@tc.com',1,'Engineering','IC3','Engineer',100000,'123-45-6789','123 Main St','555-1234','2020-01-01',2,1,1000)\")
            conn.execute(\"INSERT INTO expenses VALUES (1,1,'John Smith',500.0,'Travel','Flight','2024-01-01','approved',2,'Jane','Delta','receipts/1.pdf','')\")
            conn.execute(\"INSERT INTO projects VALUES (1,'Project Alpha','Test',1000000,500000,'active','2024-01-01','2024-12-31',1,'John','[1]',5,1)\")
            conn.execute(\"INSERT INTO benefits VALUES (1,'John Smith','Premium',200.0,'Basic','Basic','401k',5.0,'50k',500,1000,20,5)\")
            conn.commit()
            conn.close()
            print('Created minimal stub DB for CI.')
        else:
            print('Real DB found — using it.')
        "

    - name: Run tests
      run: |
        PYTHONPATH=week5/app pytest week5/tests/ -v --tb=short

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.run_id }}
        path: .pytest_cache/
        retention-days: 7

  # ── Job 2: Build & push Docker image ───────────────────────────────────────
  build-and-deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    needs: test                    # only deploy if tests pass
    permissions:
      contents: read
      id-token: write              # required for Workload Identity

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true                  # pull LFS files (techcorp.db)

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Install gke-gcloud-auth-plugin
      run: gcloud components install gke-gcloud-auth-plugin --quiet

    - name: Get GKE cluster credentials
      run: |
        gcloud container clusters get-credentials operationalizing-ai \
          --zone us-central1-a \
          --project assignment02-494503

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./week5/Dockerfile
        push: true
        tags: |
          us-central1-docker.pkg.dev/assignment02-494503/docker-repo/techcorp-agent:latest
          us-central1-docker.pkg.dev/assignment02-494503/docker-repo/techcorp-agent:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Apply k8s manifests
      run: |
        kubectl apply -f week5/k8s/deployment.yaml
        kubectl apply -f week5/k8s/service.yaml

    - name: Update deployment image to new SHA
      run: |
        kubectl set image deployment/techcorp-agent \
          techcorp-agent=us-central1-docker.pkg.dev/assignment02-494503/docker-repo/techcorp-agent:${{ github.sha }} \
          -n default

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/techcorp-agent \
          --timeout=10m \
          -n default

    - name: Get public IP
      run: |
        echo "Waiting for LoadBalancer IP..."
        for i in $(seq 1 20); do
          IP=$(kubectl get svc techcorp-agent -n default \
               -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          if [ -n "$IP" ]; then
            echo "✅ TechCorp Agent live at: http://$IP/health"
            echo "AGENT_IP=$IP" >> $GITHUB_ENV
            break
          fi
          echo "  waiting... ($i/20)"
          sleep 15
        done

    - name: Smoke test
      run: |
        if [ -n "$AGENT_IP" ]; then
          sleep 10
          curl -sf "http://$AGENT_IP/health" && echo "✅ Health check passed"
        else
          echo "⚠️  No IP yet — check GKE console for LoadBalancer status"
        fi
