name: CI — Test & Build

on:
  push:
    branches:
      - main
      - "week*"       # feature branches like week5, week6, etc.
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Test the application — runs on every push/PR, blocks deployment if it fails
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r app/backend/requirements.txt
        pip install pytest

    - name: Run tests
      run: pytest tests/ -v --tb=short

  # Job 2: Build Docker image — only on pushes to main (not on every PR)
  build:
    runs-on: ubuntu-latest
    needs: test                         # only build if tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./week2/starter/Dockerfile
        push: false        # just test the build; CD pipeline does the actual push
        tags: demand-api:latest
