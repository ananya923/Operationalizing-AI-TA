name: CD — Deploy to GKE

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Install gke-gcloud-auth-plugin
      run: |
        gcloud components install gke-gcloud-auth-plugin

    - name: Get GKE cluster credentials
      run: |
        gcloud container clusters get-credentials operationalizing-ai \
          --zone us-central1-a \
          --project assignment02-494503

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev

    - name: Build and push Docker image
      run: |
        docker build -t us-central1-docker.pkg.dev/assignment02-494503/docker-repo/demand-api:latest \
                     -t us-central1-docker.pkg.dev/assignment02-494503/docker-repo/demand-api:${{ github.sha }} \
                     .
        docker push us-central1-docker.pkg.dev/assignment02-494503/docker-repo/demand-api:latest
        docker push us-central1-docker.pkg.dev/assignment02-494503/docker-repo/demand-api:${{ github.sha }}

    - name: Update Deployment image
      run: |
        kubectl set image deployment/demand-api \
          demand-api=us-central1-docker.pkg.dev/assignment02-494503/docker-repo/demand-api:${{ github.sha }} \
          -n default

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/demand-api \
          --timeout=5m \
          -n default

    - name: Verify deployment
      run: |
        kubectl get pods -n default
        kubectl get svc demand-api -n default
