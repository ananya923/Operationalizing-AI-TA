name: Build, Test & Deploy TechCorp Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  IMAGE: techcorp-agent

jobs:
  # ---------------------------------------------------------------------------
  # 1. Run tests
  # ---------------------------------------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r week6/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run access control tests
        run: pytest week6/tests/test_access_control.py -v

      - name: Run monitoring tests
        run: pytest week6/tests/test_monitoring.py -v

  # ---------------------------------------------------------------------------
  # 2. Build and push Docker image
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test          # only runs if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build \
            -t gcr.io/$PROJECT_ID/$IMAGE:${{ github.sha }} \
            -t gcr.io/$PROJECT_ID/$IMAGE:latest \
            -f week6/Dockerfile week6/

      - name: Push Docker image
        run: |
          docker push gcr.io/$PROJECT_ID/$IMAGE:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/$IMAGE:latest

  # ---------------------------------------------------------------------------
  # 3. Deploy to GKE
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build         # only runs if build passes
    if: github.ref == 'refs/heads/main'   # only deploy on main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER \
            --zone $GKE_ZONE \
            --project $PROJECT_ID

      - name: Update image in deployment
        run: |
          kubectl set image deployment/techcorp-agent \
            techcorp-agent=gcr.io/$PROJECT_ID/$IMAGE:${{ github.sha }} \
            --namespace default

      - name: Apply service monitor
        run: |
          kubectl apply -f week6/k8s/service-monitor.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/techcorp-agent \
            --namespace default \
            --timeout=120s

      - name: Verify /metrics endpoint
        run: |
          AGENT_IP=$(kubectl get service techcorp-agent \
            --namespace default \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          curl --fail http://$AGENT_IP:8001/metrics
          echo "Metrics endpoint verified."

      - name: Verify /health endpoint
        run: |
          AGENT_IP=$(kubectl get service techcorp-agent \
            --namespace default \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          curl --fail http://$AGENT_IP:8001/health
          echo "Health endpoint verified."