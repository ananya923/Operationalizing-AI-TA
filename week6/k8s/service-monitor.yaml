apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: techcorp-agent-monitor
  namespace: default
  labels:
    app: techcorp-agent
    release: prometheus
spec:
  selector:
    matchLabels:
      app: techcorp-agent
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s